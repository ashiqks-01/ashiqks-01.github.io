<header class="nav">
  <div class="container nav__inner">
    <a class="nav__brand" href="#home" (click)="close()">
      <span class="nav__logo">AK</span>
      <span class="nav__name">Ashiq<span class="dot">.</span></span>
    </a>

    <div class="nav__right">
      <nav class="nav__links" [class.open]="menuOpen()">
        @for (link of links; track link.href) {
          <a [href]="link.href" (click)="close()">{{ link.label }}</a>
        }
        <a class="nav__cta" href="#contact" (click)="close()">Let's talk</a>
      </nav>

      <button
        class="theme-toggle"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        [title]="theme.theme() === 'dark' ? 'Light mode' : 'Dark mode'">
        @if (theme.theme() === 'dark') {
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        }
      </button>

      <button
        class="nav__burger"
        [class.open]="menuOpen()"
        (click)="toggle()"
        aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
